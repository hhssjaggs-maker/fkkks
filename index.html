<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fontaine AI · Furina & Focalors</title>
<meta name="theme-color" content="#c8d8e1">
<link rel="icon" href="furina-icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="furina" data-cloud="0">

><path d="M5 12.500l4.500 4.500L19 7.500"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.500 8.500A8 8 0 0 0 5.200 7M4.500 3.500V7.500h4M4.500 15.500A8 8 0 0 0 18.800 17M19.500 20.500V16.500h-4"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.500 10.500l4.500 4.500 4.500-4.500M5 20h14"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.500l10.500 6.500L8 18.500v-13z"/></symbol><symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3l8 4.500v9L12 21l-8-4.500v-9L12 3zM12 12l8-4.500M12 12v9M12 12L4 7.500"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.500h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-4M10 8l-4 4 4 4M6 12h10.500"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/></symbol><symbol id="i-crown" viewBox="0 0 24 24"><path d="M4.500 18.500h15M5.500 18.500L4 8.500l5 3.500 3-6 3 6 5-3.500-1.500 10"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.500 20.500a7.500 7.500 0 0 1 15 0"/></symbol><symbol id="i-bug" viewBox="0 0 24 24"><path d="M9 9a3 3 0 0 1 6 0v6a3 3 0 0 1-6 0V9zM12 9.500V18M5 11.500h4M15 11.500h4M5.500 17h3.500M15 17h3.500M9.500 6.200L7.500 4M14.500 6.200l2-2.200"/></symbol><symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5.500 14h5.500l-1 7 7.500-11H12l1-7z"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.500c0 4.500-3 7.700-7 9.500-4-1.800-7-5-7-9.500V6l7-3z"/><path d="M9 12l2 2 4-4.500"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.500 12S6 5.500 12 5.500 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-layout" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/></symbol><symbol id="i-db" viewBox="0 0 24 24"><path d="M4 6c0-1.700 3.600-3 8-3s8 1.300 8 3-3.600 3-8 3-8-1.300-8-3zM4 6v6c0 1.700 3.600 3 8 3s8-1.300 8-3V6M4 12v6c0 1.700 3.600 3 8 3s8-1.300 8-3v-6"/></symbol><symbol id="i-repeat" viewBox="0 0 24 24"><path d="M16.500 3.500l3 3-3 3M4.500 11V9.500a3 3 0 0 1 3-3h12M7.500 20.500l-3-3 3-3M19.500 13v1.500a3 3 0 0 1-3 3h-12"/></symbol><symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5M9 13h6M9 17h6"/></symbol><symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 4v16M7 20h10M5 7h14M5 7l-2.500 6.500a3 3 0 0 0 5 0L5 7zM19 7l-2.500 6.500a3 3 0 0 0 5 0L19 7z"/></symbol><symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.500 18h5M10.500 21h3M12 3a6 6 0 0 0-3.800 10.600c.7.600 1.100 1.400 1.100 2.400h5.400c0-1 .4-1.800 1.100-2.400A6 6 0 0 0 12 3z"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M5 6.500h14M5 12h14M5 17.500h9"/></symbol><symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20.500l1-4.200L16.500 4.800l3.200 3.200L8.200 19.500 4 20.500zM14 7.300l3.200 3.200"/></symbol><symbol id="i-lang" viewBox="0 0 24 24"><path d="M4 5.500h8M8 3.500v2M5.500 5.500c1 4 3 6.800 6.500 8.500M11 5.500c-1 4-3.500 7-7 8.500M13 20.500l4-9 4 9M14.500 17.500h5"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.500M12 7.800v.2"/></symbol></defs></svg>

<!-- พื้นหลังทะเล -->
<div class="bg bg-furina"></div>
<div class="bg bg-code"></div>
<canvas id="bubbles"></canvas>
<div class="waves" aria-hidden="true">
  <svg class="wave w1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 60 C180 20 540 100 720 60 C900 20 1260 100 1440 60 L1440 120 L0 120Z"/></svg>
  <svg class="wave w2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 70 C180 100 540 30 720 70 C900 100 1260 30 1440 70 L1440 120 L0 120Z"/></svg>
</div>

<!-- ด่านเข้าระบบ: คีย์ + Discord -->
<div id="gate" class="gate" data-state="loading" hidden>
  <div class="gate-card glass">
    <div class="cover"><img src="furina.jpg" alt="Furina"><div class="cover-fade"></div></div>
    <h1>Fontaine AI</h1>
    <p class="sub">โรงละครแห่งฟองแตน · เข้าได้เฉพาะผู้ได้รับเชิญ</p>

    <div class="g-pane" data-for="loading"><div class="typing"><i></i><i></i><i></i></div></div>

    <div class="g-pane" data-for="login">
      <label>① คีย์เข้าใช้งาน <small>(ใส่แค่ครั้งแรก — เคยเข้าแล้วเว้นว่างได้)</small>
        <input id="gKey" type="password" placeholder="ใส่คีย์" autocomplete="off">
      </label>
      <button id="gDiscord" class="btn discord">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18 18 0 0 0-6.4 0L8.6 3A19.8 19.8 0 0 0 3.7 4.4C.6 9 -.2 13.5.2 18a20 20 0 0 0 6 3l.8-1.3a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l.8 1.3a20 20 0 0 0 6-3c.5-5.2-.8-9.700-3.700-13.600ZM8.500 15.300c-1.200 0-2.100-1.100-2.100-2.400 0-1.300.9-2.400 2.100-2.400 1.200 0 2.100 1.100 2.100 2.400 0 1.300-.9 2.400-2.100 2.400Zm7 0c-1.200 0-2.100-1.100-2.100-2.400 0-1.300.9-2.400 2.100-2.400 1.200 0 2.100 1.100 2.100 2.400 0 1.300-.9 2.400-2.100 2.400Z"/></svg>
        ② เข้าสู่ระบบด้วย Discord
      </button>
    </div>

    <div class="g-pane" data-for="needkey">
      <p class="who">สวัสดี <b id="gWho"></b> ✨<br><small>บัญชีนี้ยังไม่ได้เปิดใช้งาน — ใส่คีย์เพื่อเข้าโรงละคร</small></p>
      <label>คีย์เข้าใช้งาน
        <input id="gKey2" type="password" placeholder="ใส่คีย์" autocomplete="off">
      </label>
      <button id="gRedeem" class="btn primary">ยืนยันคีย์</button>
      <button id="gSignOut" class="btn ghost">ออกจากระบบ</button>
    </div>

    <div class="g-pane" data-for="error">
      <button id="gRetry" class="btn primary">ลองใหม่</button>
    </div>

    <p id="gMsg" class="gmsg"></p>
  </div>
</div>

<!-- Drawer: ประวัติแชท -->
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer glass cloud-only" aria-label="ประวัติแชท">
  <div class="dr-h"><b>ประวัติแชท</b><button class="btn icon sm" id="btnCloseDrawer" title="ปิด"><svg class="i " aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <button class="btn primary newchat" id="btnNewChat"><svg class="i " aria-hidden="true"><use href="#i-plus"/></svg><span>แชทใหม่</span></button>
  <div id="convList" class="conv-list"></div>
  <div class="dr-user">
    <img id="uAv" alt="" hidden><span id="uName"></span>
    <button class="btn ghost sm" id="btnSignOut"><svg class="i " aria-hidden="true"><use href="#i-logout"/></svg><span>ออกจากระบบ</span></button>
  </div>
</aside>

<div class="app">
  <header class="top glass">
    <div class="brand">
      <button class="btn icon cloud-only" id="btnMenu" title="ประวัติแชท"><svg class="i " aria-hidden="true"><use href="#i-menu"/></svg></button>
      <div class="orb"><img src="furina-icon.jpg" alt=""></div>
      <div class="brand-t">
        <b id="pName">ฟูริน่า</b>
        <small id="pTag">Furina · โหมดสนทนา</small>
      </div>
    </div>

    <div class="seg" id="seg" role="tablist" aria-label="โหมด">
      <span class="thumb"></span>
      <button class="seg-b active" data-m="furina" role="tab"><svg class="i " aria-hidden="true"><use href="#i-crown"/></svg><span>Furina</span></button>
      <button class="seg-b" data-m="code" role="tab"><svg class="i " aria-hidden="true"><use href="#i-code"/></svg><span>Focalors Code</span></button>
    </div>

    <div class="tools">
      <button class="btn icon" id="btnSkills" title="สกิล"><svg class="i " aria-hidden="true"><use href="#i-spark"/></svg><i class="badge" id="skillCount" hidden>0</i></button>
      <button class="btn icon" id="btnExport" title="ส่งออกแชต (.md)"><svg class="i " aria-hidden="true"><use href="#i-download"/></svg></button>
      <button class="btn icon" id="btnClear" title="ล้างแชท"><svg class="i " aria-hidden="true"><use href="#i-trash"/></svg></button>
      <button class="btn icon" id="btnSettings" title="ตั้งค่า"><svg class="i " aria-hidden="true"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <footer class="composer glass">
    <div id="quick" class="quick" aria-label="ทางลัดโหมดโค้ด"></div>
    <div id="chips" class="chips"></div>
    <div class="row">
      <input type="file" id="fileInput" multiple hidden accept="image/*,.pdf,.txt,.md,.json,.csv,.js,.ts,.jsx,.tsx,.py,.html,.css,.java,.c,.cpp,.cs,.go,.rs,.php,.rb,.sh,.sql,.yml,.yaml,.xml,.log,.ini,.toml">
      <button class="btn icon" id="btnAttach" title="แนบรูป/ไฟล์"><svg class="i " aria-hidden="true"><use href="#i-clip"/></svg></button>
      <button class="btn icon toggle" id="btnWeb" title="ค้นเว็บ (Google/เว็บ)" aria-pressed="false"><svg class="i " aria-hidden="true"><use href="#i-globe"/></svg></button>
      <button class="btn icon toggle code-only" id="btnTest" title="ทดสอบโค้ดอัตโนมัติก่อนส่ง" aria-pressed="true"><svg class="i " aria-hidden="true"><use href="#i-checksq"/></svg></button>
      <textarea id="input" rows="1" placeholder="พิมพ์ข้อความ…"></textarea>
      <button class="btn send" id="btnSend" title="ส่ง"><span class="send-i"><svg class="i " aria-hidden="true"><use href="#i-send"/></svg></span><span class="stop-i"><svg class="i " aria-hidden="true"><use href="#i-stop"/></svg></span></button>
    </div>
  </footer>
</div>

<!-- Settings -->
<div class="modal-wrap" id="mSettings">
  <div class="modal glass">
    <div class="m-h"><h3><svg class="i " aria-hidden="true"><use href="#i-gear"/></svg><span>ตั้งค่า API</span></h3><button class="btn icon sm close" title="ปิด"><svg class="i " aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="m-b">
      <label>แหล่ง API Key
        <select id="fSource">
          <option value="own">ใช้ API Key ของฉันเอง (เก็บในเครื่องนี้)</option>
          <option value="proxy" class="cloud-only">ใช้ Key ของเซิร์ฟเวอร์ (ผ่าน ai-proxy)</option>
        </select>
      </label>
      <label>ผู้ให้บริการ
        <select id="fProvider"></select>
      </label>
      <label data-own>API Key <small>(เก็บในเบราว์เซอร์ของคุณเท่านั้น ไม่ขึ้นฐานข้อมูล)</small>
        <input id="fKey" type="password" placeholder="sk-... / AIza... / sk-ant-..." autocomplete="off">
      </label>
      <label data-own>Base URL
        <input id="fBase" type="text" placeholder="https://...">
      </label>
      <label>Model
        <input id="fModel" type="text" placeholder="ชื่อโมเดล">
      </label>
      <label>Tavily API Key <small>(ไม่บังคับ — ใช้ค้นเว็บให้โมเดลที่ไม่มีระบบค้นในตัว)</small>
        <input id="fTavily" type="password" placeholder="tvly-..." autocomplete="off">
      </label>
      <label>กฎ/คำสั่งเพิ่มเติม <small>(ตั้งเองได้ที่นี่ หรือใน config.js → CUSTOM_RULES)</small>
        <textarea id="fRules" rows="4" placeholder="เช่น ตอบสั้นๆ, เรียกผู้ใช้ว่า ..."></textarea>
      </label>
    </div>
    <div class="m-f">
      <button class="btn ghost" id="sCancel">ปิด</button>
      <button class="btn primary" id="sSave">บันทึก</button>
    </div>
  </div>
</div>

<!-- Skills -->
<div class="modal-wrap" id="mSkills">
  <div class="modal glass">
    <div class="m-h"><h3><svg class="i " aria-hidden="true"><use href="#i-spark"/></svg><span>สกิลของ AI</span></h3><button class="btn icon sm close" title="ปิด"><svg class="i " aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="m-b">
      <p class="hint">สกิล = ชุดคำสั่ง/ความเชี่ยวชาญที่เปิด-ปิดได้ ระบบจะแนบสกิลที่เปิดอยู่ไปกับ system prompt ทุกครั้ง</p>
      <div id="skillList" class="skill-list"></div>
      <div class="skill-add">
        <input id="skName" type="text" placeholder="ชื่อสกิล เช่น React Expert">
        <textarea id="skBody" rows="4" placeholder="คำสั่ง/ความรู้ของสกิล เช่น 'ใช้ React 18 + TypeScript เสมอ แยก component เล็กๆ ...'"></textarea>
        <button class="btn primary" id="skAdd">+ เพิ่มสกิล</button>
      </div>
    </div>
    <div class="m-f">
      <button class="btn ghost" id="skExport">ส่งออก</button>
      <button class="btn ghost" id="skImport">นำเข้า</button>
      <input type="file" id="skFile" accept=".json" hidden>
      <button class="btn primary" id="skClose">เสร็จสิ้น</button>
    </div>
  </div>
</div>

<!-- Preview / รันสด -->
<div class="modal-wrap" id="mPreview">
  <div class="modal glass wide">
    <div class="m-h"><h3 id="pvTitle">▶ ผลลัพธ์</h3><button class="btn icon sm close" title="ปิด"><svg class="i " aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="m-b pv">
      <iframe id="pvFrame" title="preview" hidden></iframe>
      <div id="pvCon" class="pv-con"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="runner.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
